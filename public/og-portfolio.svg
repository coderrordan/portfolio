<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Daniele Napolitano - Direzione operativa Amazon</title>
  <desc id="desc">Social card with an editorial headline and an Amazon control map in warm black, ivory, and orange.</desc>
  <defs>
